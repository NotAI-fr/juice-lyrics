[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "juice-wrld-lyrics"
version = "1.4.0"
description = "Manage local lyrics metadata and rmpc LRC files for MP3 libraries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mutagen>=1.47"]
license = { text = "MIT" }
authors = [
  { name = "juice-wrld-lyrics contributors" }
]
keywords = ["juice-wrld", "lyrics", "mp3", "id3", "sylt", "uslt", "rmpc"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
juice-lyrics = "juice_lyrics.cli:main"

[project.urls]
Homepage = "https://juicewrldapi.com/"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
